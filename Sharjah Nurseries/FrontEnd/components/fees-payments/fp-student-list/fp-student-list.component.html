<div class="card">
    <div class="card-header px-3">
        <h5 class="card-title">{{"Kids"  | translate}}</h5>
        <span class="payment-c">{{getSelectedKidsCount()}} / {{getTotalKidsCount()}} {{'Selected' | translate}}</span>
    </div>
    <div class="card-body p-0">
        <div class="row m-0 ch-name-list-outer">
            <ng-container *ngFor="let profile of StudentList">
                <div class="col-12 ch-name-list py-3" [ngClass]="{'selected-child':profile.selected}" (click)="onStudentSelected(profile)">
                    <span>
                        <p-checkbox class="form-check-input nd23-stud-list-checkbox" [(ngModel)]="profile.selected" [binary]="true" (onChange)="onStudentSelected(profile)"></p-checkbox>
                    </span>
                    <div class="ch-name-grade px-3">
                        <div class="col-8 d-flex">
                            <div class="ch-pro-p d-flex align-items-center">
                                <!-- <img [src]="profile?.ProfileDocumentUpload ? profile?.ProfileDocumentUpload : '../../../../../assets/images/avatar/kid-girl.png'" alt=""> -->
                                <!-- <img [src]="'../../../../../assets/images/avatar/kid-girl.png'"> -->
                                <app-profile-picture
                                    [editMode]="3"
                                    [uploadedFileKey]="profile.ProfileDocumentUpload"
                                    [defaultImgSrc]="profile?.Gender?.toLowerCase() == 'male' ?
                                                    '../../../../assets/images/avatar/kid-boy.png'
                                                : '../../../../assets/images/avatar/kid-girl.png'"
                                >
                                </app-profile-picture>
                            </div>
                            <div class="px-2">
                                <h5 class="mb-0">{{ selectedLanguage == 'en' ? profile?.FullNameInEnglish : profile?.FullNameInArabic }}</h5>
                                <label class="d-block">{{ profile?.ClassName }}</label>
                                <!-- <label *ngIf="profile.StudentStatusId && profile.StudentStatusId == 1" class="text-info"> {{ 'Enrolled' | translate }} </label>
                                <label *ngIf="profile.StudentStatusId && profile.StudentStatusId == 2" class="text-warning"> {{ 'OnHold' | translate }} </label>
                                <label *ngIf="profile.StudentStatusId && profile.StudentStatusId == 3" class="text-success"> {{ 'Graduated' | translate }} </label> -->
                                <label class="d-block card-label">{{ profile?.ChildCode }}</label>
                                <label *ngIf="profile.StudentStatusId && profile.StudentStatusId == 4" class="d-block child-status px-1 status-withdrawn"> {{ 'Withdrawn' | translate }} </label>
                            </div>
                        </div>
                        <div class="col-4 d-flex">
                            <div class="d-flex align-items-center justify-content-end fs-14 px-2">
                                <i class="fa-solid fs-12 fa-wallet title-icon-s-list mx-1" style="cursor: pointer;"  ngbTooltip="{{'Wallet' | translate}}"></i><div class="d-flex"><span>{{profile?.Wallet?.Balance ? profile?.Wallet?.Balance : 0 | number: '1.2-2'}}</span> <span class="currencyLabel">{{"AED"| translate}}</span></div>
                            </div>
                        </div>
                    </div>
                    <span class="child-selecter"><i [class]="selectedLanguage == 'en' ? 'fas fa-chevron-right' : 'fas fa-chevron-left'"></i></span>
                </div>
            </ng-container>
        </div>
    </div>
</div>
